<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Scan | CyberShield EDU</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="mode-light">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header>
        <a href="index.html" class="logo">
            <div class="logo-badge">🛡️</div>
            <span>CyberShield</span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="detector.html">Detector</a></li>
                <li><a href="audio-scan.html" class="active">Audio Scan</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="history.html">My Scans</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <div class="theme-switch" onclick="toggleTheme()"><div class="slider"></div></div>
            <a href="login.html" class="btn btn-ghost">Login</a>
        </div>
    </header>

    <main style="padding-top: 120px;">
        <div class="container">
            <div class="glass-card animateOnScroll" style="max-width: 800px; margin: 0 auto; padding: 3rem; text-align: center;">
                <div style="font-size: 3.5rem; margin-bottom: 20px;">🎙️</div>
                <h1 style="color: var(--text-main); margin-bottom: 10px;">Audio Vishing Detector</h1>
                <p style="color: var(--text-muted); margin-bottom: 40px;">Upload voice notes or recorded calls to analyze for voice phishing patterns.</p>

                <div class="input-group">
                    <div style="border: 2px dashed var(--glass-border); padding: 60px; text-align: center; border-radius: 20px; cursor: pointer; background: rgba(255,255,255,0.05);" onclick="document.getElementById('audioInput').click()">
                        <div style="font-size: 2.5rem; margin-bottom: 15px;">📁</div>
                        <p style="font-weight: 600; color: var(--text-main);">Drag & Drop Audio File</p>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">Supports MP3, WAV, M4A (Max 10MB)</p>
                        <input type="file" id="audioInput" accept="audio/*" style="display:none" onchange="document.getElementById('file-status').textContent = this.files[0].name">
                        <p id="file-status" style="margin-top: 15px; font-weight: 700; color: var(--secondary);"></p>
                    </div>
                </div>

                <button id="btn-audio-scan" class="btn btn-primary w-full" style="margin-top: 30px; padding: 20px; font-size: 1.1rem;">
                    Analyze Recording
                </button>

                <div id="result-container" style="display: none; margin-top: 40px;"></div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
