<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield EDU - Education Hub</title>
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .education-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .edu-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .edu-card:hover {
            border-color: rgba(96, 165, 250, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.1);
        }

        .edu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .category-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .difficulty-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: #cbd5e1;
            padding: 0.25rem 0.5rem;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 0.5rem;
        }

        .edu-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .edu-desc {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            flex-grow: 1;
        }

        .edu-examples {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .edu-examples h5 {
            font-size: 0.75rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .edu-examples ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .edu-examples li {
            font-size: 0.8125rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
            position: relative;
            padding-left: 1rem;
        }

        .edu-examples li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #60a5fa;
        }

        .read-more-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #60a5fa;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            transition: color 0.2s;
            margin-top: auto;
        }

        .read-more-btn:hover {
            color: #93c5fd;
        }

        .read-more-btn svg {
            width: 1rem;
            height: 1rem;
            transition: transform 0.2s;
        }

        .read-more-btn:hover svg {
            transform: translateX(4px);
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            width: 100%;
            grid-column: 1 / -1;
        }
    </style>
</head>
