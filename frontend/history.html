<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scan History - CyberShield EDU</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.25rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(30, 41, 59, 0.6);
            transform: translateX(5px);
        }

        .type-icon {
            width: 40px;
            height: 40px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .type-text {
            background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .type-url {
            background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .type-pdf {
            background: rgba(244, 63, 94, 0.1); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.2);
        }
        .type-image {
            background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .item-info {
            flex-grow: 1;
            min-width: 0;
        }

        .item-data {
            font-size: 0.9375rem;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.25rem;
        }

        .item-meta {
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            gap: 1rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-scam {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .status-safe {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('historyList');
            try {
                const history = await window.api.detection.getHistory();
                if (history.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 2rem;">No scans found. Start your first security check!</p>';
                    return;
                }

                list.innerHTML = history.map(item => {
                    const isScam = item.prediction === 'scam';
                    const date = new Date(item.created_at).toLocaleDateString(undefined, {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    
                    let iconHtml = '';
                    let typeClass = '';
                    switch(item.scan_type) {
                        case 'text':
                            typeClass = 'type-text';
                            iconHtml = '<svg style="width:1.25rem" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" /></svg>';
                            break;
                        case 'url':
                            typeClass = 'type-url';
                            iconHtml = '<svg style="width:1.25rem" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" /></svg>';
                            break;
                        case 'pdf':
                            typeClass = 'type-pdf';
                            iconHtml = '<svg style="width:1.25rem" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg>';
                            break;
                        case 'image':
                            typeClass = 'type-image';
                            iconHtml = '<svg style="width:1.25rem" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" /></svg>';
                            break;
                    }

                    return `
                        <div class="history-item">
                            <div class="type-icon ${typeClass}">${iconHtml}</div>
                            <div class="item-info">
                                <div class="item-data">${item.input_data}</div>
                                <div class="item-meta">
                                    <span>${date}</span>
                                    <span>${(item.confidence * 100).toFixed(0)}% Certainty</span>
                                </div>
                            </div>
                            <div class="status-badge ${isScam ? 'status-scam' : 'status-safe'}">
                                ${isScam ? 'Scam' : 'Safe'}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                list.innerHTML = '<p style="text-align: center; color: #fb7185; padding: 2rem;">Failed to load history. Please try again later.</p>';
            }
        });
    </script>
