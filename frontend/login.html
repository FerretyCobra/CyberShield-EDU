<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberShield EDU</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Header / Navigation -->
    <header>
        <a href="index.html" class="logo">
            <div class="logo-badge">
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
                </svg>
            </div>
            <span>CyberShield</span>
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="detector.html">Detector</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="history.html">My Scans</a></li>
                <li><a href="quiz.html">Scam Quiz</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>

        <div class="nav-actions">
            <!-- Theme Toggle -->
            <div class="theme-switch" onclick="toggleTheme()" title="Toggle Light/Dark Mode">
                <div class="slider">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
                    </svg>
                </div>
            </div>
            <a href="login.html" class="btn btn-ghost">Login</a>
            <a href="signup.html" class="btn btn-primary">Sign Up</a>
            <button class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 0;">
        <div class="glass-card" style="width: 100%; max-width: 450px; padding: 40px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 2rem; margin-bottom: 10px; background: var(--hero-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welcome Back</h1>
                <p style="color: var(--text-muted);">Secure your journey with CyberShield EDU</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label style="display: block; margin-bottom: 8px; color: var(--text-main); font-weight: 500;">Username</label>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>
                <div class="input-group">
                    <label style="display: block; margin-bottom: 8px; color: var(--text-main); font-weight: 500;">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <div id="error-message" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 15px; display: none;"></div>
                <button type="submit" id="btn-login" class="btn-primary" style="width: 100%; margin-top: 10px;">
                    Login
                </button>
            </form>

            <div style="text-align: center; margin-top: 25px; color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="signup.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign Up</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 CyberShield EDU. Stay Safe, Stay Informed.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorEl = document.getElementById('error-message');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            errorEl.style.display = 'none';

            try {
                await window.api.auth.login(username, password);
                // Reset guest scans on login
                localStorage.removeItem('cs_guest_scans');
                window.location.href = 'index.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed. Please check your credentials.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
