<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CyberShield EDU</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <div class="logo-box-large">
                    <svg class="icon-lg text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
                    </svg>
                </div>
                <h1>Create Account</h1>
                <p>Join the CyberShield EDU community</p>
            </div>

            <div class="auth-form" style="text-align: center; padding: 2rem 0;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🛠️</div>
                <h2 style="color: #fb7185; margin-bottom: 1rem;">Maintenance Mode</h2>
                <p style="color: #94a3b8; font-size: 0.875rem; line-height: 1.6;">
                    Student registration is temporarily disabled for system maintenance and bug fixes. 
                    Please check back later or contact your administrator.
                </p>
                <div style="margin-top: 2rem;">
                    <a href="login.html" class="btn-primary" style="display: inline-block; padding: 0.75rem 2rem; text-decoration: none;">Back to Login</a>
                </div>
            </div>
            <!-- Original form hidden for now -->
            <!-- <form id="signupForm" class="auth-form"> ... </form> -->

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-signup');
            const errorEl = document.getElementById('error-message');
            const successEl = document.getElementById('success-message');
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Creating account...</span>';
            errorEl.classList.add('hidden');

            try {
                await window.api.auth.register(username, email, password);
                successEl.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (err) {
                errorEl.textContent = err.message || 'Registration failed.';
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Sign Up</span>';
            }
        });
    </script>
</body>
</html>
